<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إدارة تموينات أبو حسين</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        *{font-family:'Cairo',sans-serif;}
        .img-preview { 
            width: 100%; height: 160px; border-radius: 20px; 
            background-size: cover; background-position: center; 
            display: none; margin-top: 15px; border: 2px solid #10b981; 
        }
        #permission-modal { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-[#030712] text-white">

    <div id="permission-modal">
        <div class="bg-[#0f172a] p-8 rounded-3xl w-[90%] max-w-sm text-center border border-emerald-500/20">
            <h3 class="text-xl font-black mb-4">الوصول للمعرض</h3>
            <button onclick="invokeNativeGallery()" class="w-full bg-emerald-500 text-black font-black py-4 rounded-2xl">سماح بالوصول</button>
        </div>
    </div>

    <div id="admin-content" class="p-6">
        <div class="panel-card bg-slate-900/50 p-6 rounded-3xl border border-white/5">
            <h3 class="font-bold text-emerald-400 mb-4">إضافة منتج</h3>
            <div onclick="requestGalleryPermission('p-file')" class="p-6 border-2 border-dashed border-slate-600 rounded-2xl cursor-pointer text-center">
                <i class="fas fa-camera text-2xl text-emerald-400"></i>
                <p>اختر صورة المنتج</p>
            </div>
            <input type="file" id="p-file" class="hidden">
            <div id="p-preview-box" class="img-preview"></div>
        </div>
    </div>

    <script>
        let currentTargetInput = "";

        // 1. طلب الإذن من المستخدم
        function requestGalleryPermission(inputId) {
            currentTargetInput = inputId;
            document.getElementById('permission-modal').style.display = 'flex';
        }

        // 2. التواصل مع تطبيق الأندرويد
        function invokeNativeGallery() {
            document.getElementById('permission-modal').style.display = 'none';
            if (window.AndroidBridge && typeof window.AndroidBridge.openGallery === "function") {
                window.AndroidBridge.openGallery();
            } else {
                document.getElementById(currentTargetInput).click();
            }
        }

        // 3. الدالة التي يستدعيها الأندرويد لإظهار الصورة (هذه هي الحلقة المفقودة)
        window.handleSelectedImage = function(imagePath) {
            // نحدد مربع المعاينة بناءً على المدخل الحالي
            const previewId = (currentTargetInput === 'p-file') ? 'p-preview-box' : 'cat-preview-box';
            const previewBox = document.getElementById(previewId);
            
            if (previewBox) {
                previewBox.style.backgroundImage = "url('" + imagePath + "')";
                previewBox.style.display = 'block';
                console.log("تم تحديث الواجهة بالصورة: " + imagePath);
            }
        };
    </script>
</body>
</html>
