<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم تموينات أبو حسين</title>
    <!-- استيراد خط Tajawal ليتناسب مع هوية التطبيق العربي -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- مكتبة FontAwesome للأيقونات الفخمة -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* تعريف الألوان الأساسية الخاصة بـ تموينات أبو حسين */
        :root {
            --bg-color: #0b0c10;       /* الخلفية الداكنة جداً للمتجر */
            --card-bg: #1f2833;        /* لون كروت العرض الداكنة */
            --gold-primary: #c5a880;   /* اللون الذهبي الأساسي للنصوص والعناوين */
            --gold-hover: #e5c59e;     /* ذهبي أفتح عند التمرير */
            --white-text: #ffffff;     /* نصوص بيضاء واضحة */
            --gray-text: #c5a88099;    /* نصوص ذهبية شبه شفافة للتفاصيل */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--white-text);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* رأس الصفحة (الهيدر) بنفس أسلوب المتجر */
        .header {
            width: 100%;
            max-width: 600px;
            text-align: center;
            margin-bottom: 30px;
            padding: 15px;
            border-bottom: 1px solid rgba(197, 168, 128, 0.2);
        }

        .header .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .header .logo-icon {
            background-color: var(--gold-primary);
            color: var(--bg-color);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            box-shadow: 0 0 10px rgba(197, 168, 128, 0.4);
        }

        .header h1 {
            color: var(--white-text);
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header p {
            color: var(--gold-primary);
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 2px;
        }

        /* حقل حماية الرمز السري */
        .auth-box {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border: 1px solid rgba(197, 168, 128, 0.3);
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .auth-box label {
            color: var(--white-text);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .auth-box input {
            background: rgba(11, 12, 16, 0.8);
            border: 1px solid rgba(197, 168, 128, 0.4);
            border-radius: 10px;
            padding: 8px 12px;
            color: var(--white-text);
            text-align: center;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            width: 150px;
        }

        .auth-box input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 8px rgba(197, 168, 128, 0.5);
        }

        /* شبكة كروت البيانات */
        .dashboard-grid {
            width: 100%;
            max-width: 500px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        /* تصميم الكرت الفخم */
        .dashboard-card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(197, 168, 128, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }

        /* شريط ذهبي جانبي ناعم لإعطاء لمسة جمالية */
        .dashboard-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 4px;
            height: 100%;
            background: var(--gold-primary);
            border-radius: 0 18px 18px 0;
            transition: background 0.3s ease;
        }

        .dashboard-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(197, 168, 128, 0.15);
            border-color: var(--gold-primary);
        }

        .dashboard-card:hover::before {
            background: var(--gold-hover);
        }

        /* تفاصيل الكرت اليسرى (النص والعدد) */
        .card-details {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .card-title {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
        }

        .card-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--gold-primary);
            line-height: 1;
        }

        /* الأيقونات الدائرية في الجهة اليمنى للكرت */
        .card-icon {
            width: 50px;
            height: 50px;
            background: rgba(197, 168, 128, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold-primary);
            font-size: 1.4rem;
            border: 1px solid rgba(197, 168, 128, 0.2);
            transition: all 0.3s ease;
        }

        .dashboard-card:hover .card-icon {
            background: var(--gold-primary);
            color: var(--bg-color);
            transform: scale(1.1);
            box-shadow: 0 0 12px rgba(197, 168, 128, 0.4);
        }

        /* تأثيرات شريط التنقل السفلي اللطيف للمظهر الاحترافي */
        .footer-note {
            margin-top: 40px;
            font-size: 0.75rem;
            color: var(--gray-text);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- رأس الصفحة بهوية تموينات أبو حسين -->
    <div class="header">
        <div class="logo-container">
            <div class="logo-icon">T</div>
            <h1>تموينات أبو حسين</h1>
        </div>
        <p>PREMIUM PLATFORM</p>
    </div>

    <!-- صندوق تأكيد رمز الإدارة السري المطور -->
    <div class="auth-box">
        <label for="admin-pin">رمز الإدارة السري:</label>
        <input type="password" id="admin-pin" placeholder="••••••" maxlength="6">
    </div>

    <!-- شبكة بطاقات لوحة التحكم -->
    <div class="dashboard-grid">
        
        <!-- كرت المنتجات -->
        <div class="dashboard-card">
            <div class="card-details">
                <span class="card-title">إجمالي المنتجات</span>
                <span class="card-value">37</span>
            </div>
            <div class="card-icon">
                <i class="fa-solid fa-box-open"></i>
            </div>
        </div>

        <!-- كرت الطلبات المعلقة -->
        <div class="dashboard-card">
            <div class="card-details">
                <span class="card-title">الطلبات المعلقة</span>
                <span class="card-value">15</span>
            </div>
            <div class="card-icon">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </div>
        </div>

        <!-- كرت إجمالي المستخدمين -->
        <div class="dashboard-card">
            <div class="card-details">
                <span class="card-title">إجمالي المستخدمين</span>
                <span class="card-value">5</span>
            </div>
            <div class="card-icon">
                <i class="fa-solid fa-users"></i>
            </div>
        </div>

        <!-- كرت الأقسام -->
        <div class="dashboard-card">
            <div class="card-details">
                <span class="card-title">إجمالي الأقسام</span>
                <span class="card-value">15</span>
            </div>
            <div class="card-icon">
                <i class="fa-solid fa-layer-group"></i>
            </div>
        </div>

    </div>

    <div class="footer-note">
        نظام إدارة تموينات أبو حسين السحابي © 2026
    </div>

</body>
</html>
