<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسديد الشبكات اليمنية - نظام مدارهم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #0b0c0e; 
            color: #f3f4f6; 
            margin: 0;
            padding-bottom: 40px;
        }
        .input-container {
            background-color: #1e2530;
            border: 1px solid #313d4f;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }
        .glass-card { 
            background: #141922; 
            border: 1px solid #232c3b; 
        }
        .header-gradient {
            background: linear-gradient(to bottom, #7a0000, #360000);
        }
        .network-circle {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            cursor: pointer;
            background: #161a20;
        }
        .network-circle.active {
            border-color: #f59e0b;
            transform: scale(1.08);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
        }
        .network-circle img {
            width: 85%;
            height: 85%;
            border-radius: 50%;
            object-fit: cover;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        #reviewModal { display: none; }
        #reviewModal.active { display: flex; }
        input[type="tel"]::placeholder { color: #647893; font-size: 1.05rem; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header-gradient pt-5 pb-9 text-center shadow-md">
        <h1 class="text-sm font-bold text-white/90">التسديد والشحن الفوري - مدارهم</h1>
        <p class="text-[11px] text-white/70">تموينات ابو حسين للمواد الغذائية والاستهلاكية</p>
    </header>

    <main class="max-w-md mx-auto px-4 -mt-5">
        
        <!-- Network Selection Bar -->
        <div class="flex gap-2 overflow-x-auto no-scrollbar py-3 mb-3 justify-center">
            <div id="circle-yemen_mobile" class="network-circle"><img src="https://i.postimg.cc/BZrr0yD7/images-2026-07-06T163911-011.jpg"></div>
            <div id="circle-you" class="network-circle"><img src="https://i.postimg.cc/T2zz6Sms/images-(19).png"></div>
            <div id="circle-sabafon" class="network-circle"><img src="https://i.postimg.cc/44DDgMtS/tnzyl-(2).jpg"></div>
            <div id="circle-y" class="network-circle"><img src="https://i.postimg.cc/9fgkNNCF/ev4KBYC3-400x400.png"></div>
            <div id="circle-telecom" class="network-circle"><img src="https://i.postimg.cc/GpgfSSdm/images-(18).png"></div>
        </div>

        <!-- Phone Input Card -->
        <div class="input-container rounded-xl p-3 mb-3">
            <p class="text-[11px] text-slate-300 mb-1.5 mr-1 font-semibold">رقم الهاتف أو الحساب:</p>
            <div class="flex items-center gap-2 bg-black/40 rounded-lg p-1.5 border border-white/5">
                <div class="flex-1 flex items-center">
                    <span class="text-slate-400 font-mono text-sm ml-1.5 border-r border-white/10 pl-1.5">+967</span>
                    <input type="tel" id="phone" oninput="handlePhoneInput(this.value)" placeholder="ادخل الرقم" maxlength="9"
                        class="w-full bg-transparent py-0.5 px-0.5 text-lg font-mono text-white focus:outline-none tracking-wider font-bold">
                </div>
                <div id="inputIndicator" class="w-7 h-7 rounded-full flex items-center justify-center text-slate-400 bg-white/5">
                    <i class="fa-solid fa-phone text-xs"></i>
                </div>
            </div>
        </div>

        <!-- Main Categories -->
        <div id="mainCategories" class="hidden flex justify-between bg-black/30 p-1 rounded-xl mb-3 border border-white/5 gap-1">
            <button id="m-packages" onclick="switchMainCategory('packages')" class="flex-1 py-1.5 text-[11px] font-bold rounded-lg transition-all bg-amber-500 text-slate-900">باقات حقيقية</button>
            <button id="m-credit" onclick="switchMainCategory('credit')" class="flex-1 py-1.5 text-[11px] font-bold rounded-lg transition-all text-slate-400">رصيد الحساب</button>
        </div>

        <!-- Content Grid (بطاقات الباقات المستخرجة من الـ API) -->
        <div id="pkgGrid" class="grid grid-cols-2 gap-2 mb-6"></div>

    </main>

    <!-- Review Modal -->
    <div id="reviewModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] items-center justify-center p-6">
        <div class="glass-card w-full max-w-xs rounded-xl overflow-hidden shadow-2xl border border-amber-500/20">
            <div class="bg-amber-500 p-2.5 text-slate-950 text-center">
                <i class="fa-solid fa-circle-info text-xl mb-0.5"></i>
                <h3 class="font-bold text-xs">تأكيد عملية التفعيل</h3>
            </div>
            <div class="p-4 space-y-3 text-center">
                <p class="text-xs text-slate-300">أنت على وشك تفعيل <br> <b id="vPkg" class="text-white text-sm"></b></p>
                <div class="bg-black/40 p-2 rounded-lg">
                    <p class="text-[10px] text-slate-400">للرقم المستهدف</p>
                    <b id="vPhone" class="text-base font-mono text-amber-500 tracking-wider"></b>
                </div>
                <div class="flex gap-2 pt-1">
                    <button onclick="confirmOrder()" class="flex-1 bg-amber-500 text-slate-900 font-bold py-1.5 rounded-md text-xs">تأكيد وتنفيذ</button>
                    <button onclick="closeReview()" class="flex-1 bg-white/10 text-white font-bold py-1.5 rounded-md text-xs">إلغاء</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // الرمز الذي حصلت عليه من تسجيل الدخول (access_token)
        const userAccessToken = "TaRmSQG30_jrHUiQwiVGH61Fa2vltZlGVyXHBBpcFxkb7jPV43LwnsDlsnEWtBE-bhOQn7xjGyVOM7LA8VjaO6f1z9RApmJxBGqNfP9DpTWA894aB624G5B2ghKaWlsG-IFngscQS_VdDxRrAv3rdEjIsYm8HWErbOX0fMHR_NBF1ppSJZk67iOGJ_yVXnKAVn3iZ6nH9ndPqSDNZ0Oj12rkSZQjJnmDJ7oLTYrHD-8CV34wAEROup7QBr4OMpHR0nc03IxfAn9vGPhXmwPG4I7yVvZGNkkzSVBrjlseaZgShz9Kxv6pAzaiZ8kMgLfKsnD-TOPcSCP4q03WVlGv059bCurVpw0DH3546KRZYnpvpGeOwGEvHX-ZXRaxWBe7EcGOiLT94IFa7O8rxIcHPSksUj1rAdy3KUM5Jj2FDfvb0RD50TVqQVupWzMj9sN0tm-hbD921SlRyJJN79hZh1S3_g6FII4yIIHUZOfSUI8";

        // مصفوفة الباقات الحقيقية المستخرجة من استجابة AvailableOffers الخاصة بـ Mdarahim API
        const realPackages = [
            { offer_id: "A4826", offer_name: "مزايا فورجي 24 ساعة", amount: 300.0 },
            { offer_id: "A64329", offer_name: "باقة مزايا الأسبوعية", amount: 485.0 },
            { offer_id: "A33000", offer_name: "باقة فولتي إتصال", amount: 1000.0 },
            { offer_id: "A3435", offer_name: "نت توفير 3 جيجا الأسبوعية", amount: 1125.0 },
            { offer_id: "A32000", offer_name: "باقة فولتي توفير", amount: 1300.0 },
            { offer_id: "A33881", offer_name: "باقة تواصل", amount: 1500.0 },
            { offer_id: "A33883", offer_name: "باقة فولتي ماكس", amount: 1900.0 },
            { offer_id: "A33882", offer_name: "باقة تواصل ماكس", amount: 2000.0 },
            { offer_id: "A3436", offer_name: "نت توفير 6 جيجا الشهرية", amount: 2250.0 },
            { offer_id: "A3825", offer_name: "نت توفير فورجي 5 جيجا", amount: 2300.0 },
            { offer_id: "A4828", offer_name: "باقة نت فورجي 8 جيجا", amount: 3900.0 },
            { offer_id: "A39053", offer_name: "مزايا أعمال 4جي", amount: 5000.0 },
            { offer_id: "A3347", offer_name: "نت توفير 25 جيجا فورجي", amount: 8830.0 },
            { offer_id: "A4830", offer_name: "باقة نت فورجي 20 جيجا", amount: 9700.0 }
        ];

        let selectedPackageForAction = null;

        function handlePhoneInput(val) {
            resetUI();
            let found = "";
            if (val.startsWith('73')) found = 'you';
            else if (val.startsWith('77') || val.startsWith('78')) found = 'yemen_mobile';
            else if (val.startsWith('71')) found = 'sabafon';
            else if (val.startsWith('70')) found = 'y';

            if (found) {
                document.getElementById(`circle-${found}`).classList.add('active');
                document.getElementById('mainCategories').classList.remove('hidden');
                switchMainCategory('packages');
            }
        }

        function switchMainCategory(cat) {
            if (cat === 'packages') {
                renderPackagesCards(realPackages);
            } else {
                fetchAccountBalance();
            }
        }

        function renderPackagesCards(items) {
            const grid = document.getElementById('pkgGrid');
            grid.innerHTML = '';
            items.forEach(p => {
                const card = document.createElement('div');
                card.className = "glass-card p-2.5 rounded-xl text-center active:scale-95 transition-all cursor-pointer relative overflow-hidden flex flex-col justify-between h-24";
                card.onclick = () => showReview(p);
                
                card.innerHTML = `
                    <div>
                        <div class="text-[9px] font-bold text-amber-500 mb-0.5">رمز: ${p.offer_id}</div>
                        <div class="text-[11px] font-bold text-white mb-1 truncate px-0.5 leading-tight">${p.offer_name}</div>
                    </div>
                    <div>
                        <div class="text-[13px] font-mono font-black text-emerald-400">${p.amount} <span class="text-[8px] font-sans font-normal text-slate-400">ريال</span></div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function fetchAccountBalance() {
            const grid = document.getElementById('pkgGrid');
            grid.innerHTML = '<p class="col-span-2 text-center text-slate-400 py-6 text-xs">جاري جلب رصيد الحساب...</p>';
            try {
                const response = await fetch("https://www.mdarahim.net/api/ac/v1/do", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${userAccessToken}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ "AC": 8 })
                });
                const res = await response.json();
                if(res.RC === 1) {
                    grid.innerHTML = `
                        <div class="col-span-2 glass-card p-4 rounded-xl text-center">
                            <p class="text-xs text-slate-400 mb-1">رصيد حسابك الحالي في مدارهم</p>
                            <h2 class="text-2xl font-mono font-black text-emerald-400">${res.BAL} <span class="text-xs text-white">ريال</span></h2>
                        </div>
                    `;
                } else {
                    grid.innerHTML = `<p class="col-span-2 text-center text-red-400 py-4 text-xs">فشل جلب الرصيد: ${res.RD}</p>`;
                }
            } catch(e) {
                grid.innerHTML = `<p class="col-span-2 text-center text-red-400 py-4 text-xs">خطأ في الاتصال بالخادم</p>`;
            }
        }

        function resetUI() {
            document.querySelectorAll('.network-circle').forEach(c => c.classList.remove('active'));
            document.getElementById('mainCategories').classList.add('hidden');
            document.getElementById('pkgGrid').innerHTML = '';
        }

        function showReview(pkg) {
            selectedPackageForAction = pkg;
            document.getElementById('vPhone').innerText = document.getElementById('phone').value;
            document.getElementById('vPkg').innerText = pkg.offer_name;
            document.getElementById('reviewModal').classList.add('active');
        }

        function closeReview() { 
            document.getElementById('reviewModal').classList.remove('active'); 
        }

        async function confirmOrder() {
            const phoneNumber = document.getElementById('phone').value;
            if (!phoneNumber || phoneNumber.length < 9) {
                alert("يرجى إدخال رقم هاتف صحيح.");
                closeReview();
                return;
            }

            const transactionId = Math.floor(100000000 + Math.random() * 900000000).toString();

            const payload = {
                "AC": 4, // 4 لتفعيل باقة يمن موبايل
                "ACT": 1, // 1 لإضافة الباقة
                "PSI": 1,
                "OFFER_ID": selectedPackageForAction.offer_id,
                "NUM": phoneNumber,
                "TRANID": transactionId
            };

            closeReview();
            alert("جاري إرسال طلب التفعيل إلى مدارهم...");

            try {
                const response = await fetch("https://www.mdarahim.net/api/ac/v1/do", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${userAccessToken}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.RC === 1) {
                    alert(`✅ تمت العملية بنجاح!\n${result.RD}`);
                } else if (result.RC === 2 || result.RC === -1) {
                    alert(`⏳ العملية معلقة، رقم المرجع: ${transactionId}`);
                } else {
                    alert(`❌ فشلت العملية: ${result.RD || 'خطأ غير معروف'} (كود: ${result.RC})`);
                }
            } catch (err) {
                alert("حدث خطأ أثناء الاتصال بالخادم.");
            }
        }
    </script>
</body>
</html>
