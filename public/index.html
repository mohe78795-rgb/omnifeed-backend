<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تموينات أبو حسين | Supplies & Prestige</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة Plyr للفيديو الاحترافي -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#05070a] text-white min-h-screen pb-32">

    <audio id="snd-click" src="https://assets.mixkit.co/active_storage/sfx/2568/2358-preview.mp3" preload="auto"></audio>
    <audio id="snd-cashier" src="https://assets.mixkit.co/active_storage/sfx/592/592-preview.mp3" preload="auto"></audio>
    <audio id="snd-notification" src="https://assets.mixkit.co/active_storage/sfx/911/911-preview.mp3" preload="auto"></audio>

    <div class="blob"></div>
    <div class="blob blob-2"></div>

    <div id="splash" class="fixed inset-0 z-[3000] bg-[#05070a] flex items-center justify-center">
        <h1 class="text-3xl font-black text-emerald-400 animate-pulse">تموينات أبو حسين</h1>
    </div>

    <!-- شاشة الدخول -->
    <div id="auth-screen" class="fixed inset-0 z-[2000] auth-bg hidden overflow-y-auto flex items-center justify-center p-6">
        <div class="w-full max-w-md bg-slate-900/40 backdrop-blur-xl border border-white/5 p-8 rounded-[2.5rem] space-y-6 animate-fadeIn">
            <div class="text-center space-y-2">
                <h2 id="auth-title" class="text-2xl font-black text-emerald-400">تسجيل الدخول</h2>
                <p class="text-xs text-slate-400">منظومة أبو حسين الرقمية الذكية</p>
            </div>
            <div class="space-y-4">
                <div id="signup-name-container" class="hidden space-y-1">
                    <label class="text-[11px] text-slate-400 mr-2">الاسم الكامل</label>
                    <input type="text" id="auth-name" class="royal-input" placeholder="عبد الله محمد...">
                </div>
                <div class="space-y-1">
                    <label class="text-[11px] text-slate-400 mr-2">رقم الهاتف</label>
                    <input type="tel" id="auth-phone" class="royal-input" placeholder="7xxxxxxxx">
                </div>
                <div class="space-y-1">
                    <label class="text-[11px] text-slate-400 mr-2">الرمز السري</label>
                    <input type="password" id="auth-pass" class="royal-input" placeholder="••••••••">
                </div>
            </div>
            <button id="auth-btn" onclick="handleAuth()" class="w-full bg-emerald-500 text-black font-black py-4 rounded-2xl shadow-lg active:scale-95 transition">دخول آمن</button>
            <div class="text-center pt-2">
                <span id="auth-toggle-text" class="text-xs text-slate-400">ليس لديك حساب؟</span>
                <button id="auth-toggle-btn" onclick="toggleAuthMode()" class="text-xs text-emerald-400 font-bold underline mr-1">إنشاء حساب جديد</button>
            </div>
        </div>
    </div>

    <div id="app-layout" class="hidden pt-28 px-6 space-y-8">
        <!-- الهيدر -->
        <header class="fixed top-0 left-0 right-0 z-[1000] px-6 py-6 bg-black/60 backdrop-blur-xl border-b border-white/5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div id="u-avatar" class="w-10 h-10 bg-emerald-500 text-black rounded-xl flex items-center justify-center font-black">..</div>
                <div>
                    <h1 class="font-black text-sm text-slate-100">تموينات أبو حسين</h1>
                    <span class="text-[8px] text-emerald-500 animate-pulse">المتجر الرسمي</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="refresh-btn" onclick="manualRefresh()" class="w-10 h-10 bg-white/5 rounded-xl border border-white/5 flex items-center justify-center transition-all duration-500">
                    <i class="fas fa-sync-alt text-emerald-500 text-xs"></i>
                </button>
                <div id="u-balance-top" class="px-4 py-2 bg-emerald-500/10 border border-emerald-500/20 rounded-full text-emerald-500 font-black text-[11px]">0 YER</div>
            </div>
        </header>

        <!-- الصفحة الرئيسية -->
        <div id="view-home" class="view-content space-y-6 animate-fadeIn">
            <!-- مشغل الفيديو الاحترافي -->
            <div id="ad-video-container" class="hidden relative w-full aspect-video rounded-3xl overflow-hidden border border-white/5 bg-slate-950">
                <div id="player" data-plyr-provider="youtube" data-plyr-embed-id=""></div>
                <button onclick="toggleMute()" class="absolute bottom-4 left-4 z-10 w-10 h-10 bg-black/60 backdrop-blur-md rounded-full border border-white/10 flex items-center justify-center text-white text-xs">
                    <i id="mute-icon" class="fas fa-volume-mute"></i>
                </button>
            </div>

            <div class="flex justify-between items-center bg-white/5 p-2 rounded-2xl border border-white/5">
                <span class="text-xs font-bold text-slate-300 mr-2">شكل العرض:</span>
                <div class="flex gap-1">
                    <button id="btn-layout-0" onclick="setLayout(0)" class="px-3 py-1.5 rounded-xl text-xs font-black bg-emerald-500 text-black transition"><i class="fas fa-th-large"></i></button>
                    <button id="btn-layout-1" onclick="setLayout(1)" class="px-3 py-1.5 rounded-xl text-xs font-black text-slate-400 transition"><i class="fas fa-th"></i></button>
                    <button id="btn-layout-2" onclick="setLayout(2)" class="px-3 py-1.5 rounded-xl text-xs font-black text-slate-400 transition"><i class="fas fa-bars"></i></button>
                </div>
            </div>
            <div id="categories-list" class="cards-container mode-dual"></div>
        </div>

        <!-- صفحة المنتجات -->
        <div id="view-products" class="view-content hidden space-y-6 animate-fadeIn">
            <div class="flex items-center gap-4">
                <button onclick="changeView('home', document.querySelector('button[onclick*=\'home\']'))" class="w-10 h-10 bg-white/5 border border-white/5 rounded-xl flex items-center justify-center text-slate-400"><i class="fas fa-chevron-right text-xs"></i></button>
                <h2 id="cat-title-display" class="text-xl font-black text-emerald-400">..</h2>
            </div>
            <div id="products-list" class="grid grid-cols-1 gap-3"></div>
        </div>

        <!-- صفحة الألعاب -->
        <div id="view-games" class="view-content hidden space-y-6 animate-fadeIn">
            <h2 class="text-2xl font-black">شحن الألعاب ⚡</h2>
            <div id="games-list" class="grid grid-cols-1 gap-3"></div>
            <div id="game-topup-panel" class="hidden bg-slate-900/30 p-6 rounded-[2rem] border border-white/5 space-y-5">
                <h3 id="selected-game-title" class="font-black text-emerald-400">..</h3>
                <input type="text" id="game-player-id" class="royal-input" placeholder="Player ID">
                <div id="player-name-display" class="hidden text-xs bg-emerald-500/10 p-3 rounded-xl font-bold text-emerald-400"></div>
                <div id="game-denoms-list" class="grid grid-cols-2 gap-2"></div>
                <button onclick="processGameTopup()" class="w-full bg-emerald-500 text-black font-black py-4 rounded-2xl shadow-xl">تأكيد الشحن</button>
            </div>
        </div>

        <!-- صفحة الدردشة الداخلية -->
        <div id="view-notifications" class="view-content hidden flex flex-col h-[65vh] animate-fadeIn">
            <h2 class="text-2xl font-black mb-4">الدردشة والدعم ✉️</h2>
            <div id="messages-list" class="flex-1 overflow-y-auto space-y-3 p-4 bg-white/5 rounded-3xl border border-white/5 custom-scrollbar">
                <!-- الرسائل تظهر هنا كفقاعات -->
            </div>
            <div class="mt-4 flex gap-2 p-2 bg-white/5 rounded-2xl border border-white/5">
                <input type="text" id="chat-input" class="flex-1 bg-transparent outline-none px-4 text-sm" placeholder="اكتب رسالتك هنا...">
                <button onclick="sendUserMessage()" class="w-12 h-12 bg-emerald-500 text-black rounded-xl flex items-center justify-center">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <!-- صفحة الفواتير -->
        <div id="view-orders" class="view-content hidden space-y-6 animate-fadeIn">
            <h2 class="text-2xl font-black">فواتيري</h2>
            <div id="orders-list" class="space-y-4"></div>
        </div>

        <!-- صفحة السلة -->
        <div id="view-cart" class="view-content hidden space-y-6 animate-fadeIn">
            <h2 class="text-2xl font-black">حقيبة التسوق</h2>
            <div id="cart-list" class="space-y-3"></div>
            <div class="p-5 bg-white/5 rounded-3xl border border-white/5 flex justify-between items-center">
                <span class="text-sm">الإجمالي:</span>
                <span id="cart-total" class="text-xl font-black text-emerald-400">0 YER</span>
            </div>
            <button onclick="checkout()" class="w-full bg-emerald-500 text-black font-black py-4 rounded-2xl">إتمام الشراء</button>
        </div>

        <!-- صفحة الحساب -->
        <div id="view-account" class="view-content hidden space-y-6 animate-fadeIn">
            <div class="p-6 bg-white/5 rounded-[2rem] border border-white/5 text-center space-y-4">
                <div class="w-16 h-16 bg-emerald-500 text-black text-2xl font-black rounded-2xl mx-auto flex items-center justify-center" id="acc-avatar-large">..</div>
                <h3 id="acc-name" class="font-black text-lg">..</h3>
                <p id="acc-phone" class="text-xs text-slate-400">..</p>
                <div class="pt-4 border-t border-white/5 text-xs text-slate-400 flex justify-between px-4">
                    <span>انضممت إلينا في:</span>
                    <span id="acc-date" class="text-white">..</span>
                </div>
            </div>
            <button onclick="logout()" class="w-full bg-red-500/10 text-red-400 border border-red-500/20 font-black py-4 rounded-2xl">خروج</button>
        </div>

        <!-- النافبار السفلي -->
        <nav class="fixed bottom-0 left-0 right-0 h-24 bg-black/80 backdrop-blur-2xl border-t border-white/5 grid grid-cols-6 items-center z-[500] px-1">
            <button onclick="changeView('home', this)" class="nav-item active"><i class="fas fa-home"></i><span>الرئيسية</span></button>
            <button onclick="changeView('games', this)" class="nav-item"><i class="fas fa-gamepad"></i><span>الألعاب</span></button>
            <button onclick="changeView('cart', this)" class="nav-item"><i class="fas fa-shopping-bag"></i><span>السلة</span></button>
            <button onclick="changeView('orders', this)" class="nav-item"><i class="fas fa-receipt"></i><span>فواتيري</span></button>
            <button onclick="changeView('notifications', this)" class="nav-item relative">
                <i class="fas fa-comment-dots"></i><span>الدردشة</span>
                <span id="msg-dot" class="hidden absolute top-4 right-5 w-2 h-2 bg-emerald-500 rounded-full animate-ping"></span>
            </button>
            <button onclick="changeView('account', this)" class="nav-item"><i class="fas fa-user-circle"></i><span>حسابي</span></button>
        </nav>
    </div>

    <!-- التوست والتحكم بالمنتج -->
    <div id="toast" class="fixed bottom-28 left-6 right-6 z-[4000] bg-emerald-500 text-black px-5 py-4 rounded-2xl text-xs font-black text-center hidden animate-slideUp"></div>
    <div id="sheet-overlay" class="fixed inset-0 bg-black/95 z-[1500] hidden" onclick="closeSheet()"></div>
    <div id="product-sheet" class="fixed bottom-[-100%] left-0 right-0 z-[1600] bg-[#05070a] border-t border-white/10 rounded-t-[3rem] p-10 transition-all duration-500">
        <img id="sh-img" class="w-full h-64 object-cover rounded-[2.5rem] mb-6">
        <h2 id="sh-name" class="text-2xl font-black mb-2"></h2>
        <p id="sh-price" class="text-3xl font-black text-emerald-400 mb-8"></p>
        <button id="sh-add-btn" class="w-full bg-emerald-500 text-black font-black py-4 rounded-2xl">إضافة للسلة</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
